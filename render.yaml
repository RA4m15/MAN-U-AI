services:
  # ── MAN-U-AI Backend API Service ──────────────────────────────
  - type: web
    name: man-u-ai-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @man-u-ai/shared build && pnpm --filter @man-u-ai/api build
    startCommand: pnpm --filter @man-u-ai/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: VECTOR_STORE
        value: mongodb
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /var/data/uploads
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
    disk:
      name: uploads-disk
      mountPath: /var/data/uploads
      sizeGB: 10
    healthCheckPath: /health

  # ── MAN-U-AI Web Frontend Static Site ─────────────────────────
  - type: web
    name: man-u-ai-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @man-u-ai/shared build && pnpm --filter @man-u-ai/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

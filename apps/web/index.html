<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1011" />
    <meta name="description" content="MAN-U-AI — Multimodal Generative AI Assistant for Industrial SOPs, Equipment Manuals, Technical Diagrams and Expert Knowledge" />
    <title>MAN-U-AI | Industrial AI Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root">
      <div style="min-height: 100vh; background-color: #070B14; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <img src="/logo.png" alt="MAN-U-AI" style="width: 52px; height: 52px; margin-bottom: 16px; object-fit: contain;" />
        <div style="color: #0057ff; font-family: monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px;">MAN-U-AI CONSOLE</div>
        <div style="color: #71717a; font-size: 12px; margin-bottom: 20px;">Initializing operational workspace...</div>
        <div style="width: 140px; height: 3px; background: #1e293b; border-radius: 2px; overflow: hidden; position: relative;">
          <div style="width: 50px; height: 100%; background: #0057ff; position: absolute; animation: loaderPulse 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes loaderPulse {
            0% { left: -40%; width: 30%; }
            50% { left: 40%; width: 50%; }
            100% { left: 100%; width: 30%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

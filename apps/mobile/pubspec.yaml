name: manuai_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: any
  dio: any
  flutter_secure_storage: any
  go_router: any
  google_fonts: any
  flutter_markdown: any
  file_picker: any
  camera: ^0.12.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: any
  mocktail: any
  http_mock_adapter: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/conveyor_belt_a61.png
    - assets/images/conveyor_belt_a61_dark.png
    - assets/images/turbocompressor_b01.png
    - assets/images/drypix_6000.png
    - assets/images/drypix_schematic_units.png
